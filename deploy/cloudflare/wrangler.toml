# TorSOCKS5 TSU/1 隧道中继（Cloudflare Worker）
#
# 部署前必读：
#   1. TSU_TOKEN 是密钥，**不要**写进本文件，用下面的命令设置：
#        wrangler secret put TSU_TOKEN
#      本地调试可以写进同级目录的 .dev.vars（已被仓库忽略），或用
#        wrangler dev --var TSU_TOKEN:devtoken
#   2. 白名单默认开启（TSU_ALLOW_ALL="0"），不在 TSU_ALLOW_HOSTS 里的目标一律 NOT_ALLOWED。
#      确认风险后想放开可以改成 TSU_ALLOW_ALL="1"，但私网/回环地址**始终**被拒绝。
#   3. Cloudflare 条款 2.2.1(j) 明文禁止用其服务提供 VPN 或类似代理服务，
#      账号可能被封，详见 README.md 的警告段落。

name = "torsocks5-tsu-relay"
main = "worker.js"
# 与 wrangler 4.x / workerd 的当前版本对齐；如需用更新特性可改到更高日期。
compatibility_date = "2026-09-01"

# 单请求出站连接上限 6 是免费版硬限制，max_streams 由代码夹到 [1, 6]。
[vars]
TSU_ALLOW_ALL = "0"
TSU_ALLOW_PORTS = "443,80,22,9418"
# 后缀匹配：github.com 命中 github.com 与 api.github.com；
# 以 . 开头的条目（.githubusercontent.com）只命中子域。
TSU_ALLOW_HOSTS = "torproject.org,github.com,.githubusercontent.com"
TSU_MAX_STREAMS = "6"
TSU_PATH = "/tsu"
# 单条流空闲多久后 RESET（秒），默认 300。
# TSU_STREAM_IDLE_TIMEOUT = "300"

# 生产建议开观测，便于看连接数与错误类型（不记录目标地址）。
[observability]
enabled = true
