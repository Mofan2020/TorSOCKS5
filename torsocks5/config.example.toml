# TorSOCKS5 配置示例
# 复制到下列位置后按需修改：
#   macOS/Linux: ~/.config/torsocks5/config.toml
#   Windows:     %APPDATA%\torsocks5\config.toml
# 也可以用 `torsocks5 config init` 自动生成。

[proxy]
# 监听的地址与端口。默认只监听本机回环，避免把代理暴露到公网。
listen = "127.0.0.1"
port = 9051

# 流量路由方式（也可以用 `torsocks5 run --route xxx` 临时覆盖）：
#   "tor-meek"   Tor 网络 + meek 网桥（默认）：最抗封锁、最慢
#   "cf-relay"   Cloudflare Worker 中转：免费额度，受平台限制与条款约束
#   "self-relay" 自建 / 多平台中继：不依赖 Tor，速度接近直连
route = "tor-meek"

# 留空表示免认证（仅本机使用时推荐）。填上用户名/密码后会启用 RFC 1929 认证，
# 同时 tor 侧会按 IsolateSOCKSAuth 做流量隔离（不同用户走不同线路）。
username = ""
password = ""

# 允许使用本代理的来源地址，支持 IP 与 CIDR，可用 "!" 前缀表示拒绝。
allow_from = ["127.0.0.1", "::1"]

# 连接数上限 / 空闲超时（秒）/ 建立连接超时（秒）
max_connections = 512
idle_timeout = 300
connect_timeout = 30

# 是否支持 UDP ASSOCIATE（DNS over UDP、部分游戏/语音）
# 注意：隧道路由（cf-relay / self-relay）只承载 TCP，这里开了也无效。
udp_associate = true

# 打印每条连接日志
verbose = false

[split]
# 智能分流：只对 cf-relay / self-relay 生效（tor-meek 本身就是完整代理，不需要分流）。
#   "auto"  = 按路由自动决定（cf-relay → smart；self-relay → all；tor-meek → off）
#   "smart" = 命中「需要辅助访问」名单才走隧道，其余直连
#   "all"   = 除私有地址外全部走隧道
#   "off"   = 不分流，全部走隧道
mode = "auto"

# 内置名单开关（内置 59 条代理名单 + 一批国内直连名单，见 docs/routes.md）
builtin_proxy = true
builtin_direct = true

# 自定义规则：后缀匹配，`github.com` 同时命中 api.github.com
# proxy_hosts = ["example.com"]
# direct_hosts = ["intranet.example"]

[cf_relay]
# 路由方式 2：自行部署 Cloudflare Worker 后填入地址。
url = ""
token = ""
# links = 4         # 并发 WS 链路数
# max_streams = 6   # Cloudflare 免费版硬限制：单个请求最多 6 条并发出站连接

# 多中继负载均衡（配置了 [[cf_relay.nodes]] 节点数组时生效）：
# lb_strategy = "weighted_rr"    # weighted_rr=加权轮询 | least_conn=最少连接+延迟感知
#                                # split_binding=按分流规则绑定中继
# circuit_breaker_threshold = 5  # 连续失败达到该值则熔断该节点
# circuit_breaker_timeout = 60   # 熔断后冷却秒数，期间自动降级到其它节点

[self_relay]
# 路由方式 3：torsocks5 relay serve（本机/VPS）。
url = ""
token = ""
# links = 4
# max_streams = 64

# 多中继：改用节点数组即可同时连多个中继，自动负载均衡；
# 单 url/token 的旧写法继续可用（只有一个节点时效果等价）。
# lb_strategy = "weighted_rr"
# circuit_breaker_threshold = 5
# circuit_breaker_timeout = 60
#
# [[self_relay.nodes]]
# url = "ws://127.0.0.1:9052/tsu"
# token = ""
# weight = 3                     # 加权轮询权重（默认 1）
# max_streams = 64
# health_check_interval = 30     # 健康检查间隔（秒）
# bind_hosts = ["github.com"]    # split_binding 策略：命中后缀的流量固定走此节点
#
# [[self_relay.nodes]]
# url = "ws://10.0.0.2:9052/tsu"
# token = ""
# weight = 1

[relay]
# 自建中继服务端（`torsocks5 relay serve` 读取这一段）
listen = "127.0.0.1"
port = 9052
# 令牌：不设置时只能监听回环地址，否则等于开放代理
token = ""
# 目标白名单：allow_all = false 时只放行 allow_hosts 命中的目标
allow_all = false
# allow_hosts = ["github.com", "pypi.org"]
# allow_ports = [443, 80, 22, 9418]
max_streams = 64

# ---------------- 服务端强化（0 或留空 = 关闭，全部可选） ----------------
# 限流（令牌桶，平滑限流允许受控突发）
# rate_limit_rps = 0          # 全局每秒令牌数
# rate_limit_burst = 0        # 桶容量（默认等于 rate）
# per_client_rps = 0          # 单客户端 IP 每秒令牌数
# per_token_rps = 0           # 单令牌每秒令牌数

# 并发连接数限制
# max_conns_per_ip = 0        # 单 IP 最大并发连接
# max_conns_per_token = 0     # 单令牌最大并发连接
# max_conns_total = 0         # 总并发上限

# IP 过滤（支持 CIDR；黑名单优先，白名单非空时只放行白名单）
# ip_whitelist = ["192.168.0.0/16"]
# ip_blacklist = ["10.1.2.3"]

# 熔断：窗口内连续出站失败过多时短暂拒绝新连接，避免拖垮上游
# circuit_breaker_enabled = false
# cb_error_threshold = 20     # 窗口内错误数阈值
# cb_window_seconds = 10      # 统计窗口（秒）
# cb_recovery_seconds = 30    # 熔断持续时间（秒）

# 结构化访问日志（JSON Lines；默认不记录目标域名，保护隐私）
# access_log = "~/.torsocks5/relay-access.log"
# access_log_format = "json"  # json | text

[tor]
# tor 可执行文件路径，留空自动探测（PATH、Tor Browser、Homebrew、常见安装位置）
# binary = "/opt/homebrew/bin/tor"

# 留空自动分配空闲端口；指定后可用于固定端口做防火墙放行
# socks_port = 0
# control_port = 0

# 数据目录（tor 的缓存、geoip、控制端口 cookie 都在这里）
# data_dir = "~/.cache/torsocks5"

# 日志级别：err / warn / notice / info / debug
log_level = "notice"

# meek 传输的提供方式：
#   "plugin"  = 使用本项目自带的 Python meek 传输（默认，跨平台、无需编译）
#   "builtin" = 使用 tor 内置的 meek 传输（需要你的 tor 编译时带 meek）
#   "off"     = 不注册传输插件（配合 direct = true 直连 Tor）
meek_mode = "plugin"

# true = 忽略网桥，直接连接 Tor（网络没被墙时更快）
direct = false

# tor 意外退出时自动重启
restart = true

# 是否允许 tor 写缓存（geoip 等）。关闭更"干净"，但每次启动都要重新下载
avoid_disk_writes = false

# 追加任意 tor 启动参数
# extra_options = ["TorCircuitBuildTimeout 120", "LearnCircuitBuildTimeout 30"]

# 流量隔离（每个设置都会让不同流量走不同线路，更匿名但更慢）
isolation = ["IsolateSOCKSAuth", "IsolateClientProtocol"]

# 传给 ClientTransportPlugin 的传输名（网桥行里写 meek / meek_lite 都能用）
# meek.methods 在下面的 [meek] 段里

# 如果安装路径含空格导致插件无法启动，可手动指定一个无空格的临时目录
# pt_shim_dir = "/tmp/torsocks5-pt"

[meek]
methods = ["meek", "meek_lite", "meek_azure"]
connect_timeout = 20.0
read_timeout = 30.0
verbose = false

[bridges]
# 网桥配置文件位置，留空使用默认路径（与 config.toml 同目录）
# file = "~/.config/torsocks5/bridges.toml"

# 没有任何网桥时，是否回落到内置的公开 meek 网桥（可能已失效，仅作保底）
builtin = true

[hotreload]
# 配置热重载：SIGHUP 信号 + 本机 HTTP API 双重触发，改配置不用重启进程。
enabled = true             # 发送 SIGHUP 重载（kill -HUP <pid>）
watch = false              # 额外监听配置文件 mtime，保存即自动重载
api_enabled = true         # 本机 HTTP API（只监听 127.0.0.1）
# api_host = "127.0.0.1"
# api_port = 9053
# api_path = "/api/config/reload"
# API 用 proxy.username / proxy.password 做 Basic Auth（未设置凭据时一律拒绝）：
#   curl -u user:pass http://127.0.0.1:9053/api/config/reload          # 查看状态
#   curl -u user:pass -X POST http://127.0.0.1:9053/api/config/reload  # 触发重载
# 可热更：超时/连接数/认证等立即生效；路由与分流变更热切换（已有连接不受影响）

[web]
# Web 管理面板：仪表盘 / 路由切换 / 网桥管理 / 配置编辑 / 实时日志。
# 也可以用 `torsocks5 run --web` 临时开启（等价 enabled = true）。
enabled = false
listen = "127.0.0.1"         # 默认只监听本机；改 0.0.0.0 前请务必设置强密码
port = 9054
# Basic Auth 账号密码（写在配置文件里）。密码留空则启动时随机生成并打印到日志。
username = "admin"
password = ""

[version_check]
# 版本更新检查：启动时后台查 GitHub Releases（3 秒超时、结果缓存 24 小时、
# 网络失败完全静默，不影响正常使用）
enabled = true
# interval_hours = 24      # 结果缓存时长（0 = 每次启动都查）

[logging]
# 结构化日志：配置 file 后，日志在写终端的同时追加一份到文件。
# JSON Lines 格式（每行一个 JSON 对象），带大小+时间轮转、gzip 压缩与敏感信息脱敏。
# format = "json"           # json | text
# level = "info"            # debug | info | warn | error
# file = "~/.torsocks5/run.jsonl"
# max_size_mb = 100         # 单文件大小上限
# max_files = 10            # 保留的历史文件数
# max_age_days = 30         # 按天轮转
# compress = true           # 轮转后 gzip 压缩
# redact = []               # 额外要脱敏的字段名（token/password 等已默认脱敏）
