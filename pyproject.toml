[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torsocks5"
version = "2.0.1"
description = "跨平台 SOCKS5 本地代理：Tor+meek 网桥 / Cloudflare Worker 中转 / 自建隧道路由可选（纯 Python）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TorSOCKS5 contributors" }]
keywords = ["tor", "meek", "socks5", "proxy", "bridge", "pluggable-transport", "censorship"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP",
]
# 运行期零第三方依赖，只用标准库
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.8", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/Mofan2020/TorSOCKS5"
Repository = "https://github.com/Mofan2020/TorSOCKS5"
Issues = "https://github.com/Mofan2020/TorSOCKS5/issues"

[project.scripts]
torsocks5 = "torsocks5.cli:main"

[tool.setuptools]
packages = ["torsocks5", "torsocks5.socks5", "torsocks5.tor", "torsocks5.meek"]
py-modules = ["meek_pt"]

[tool.setuptools.package-data]
torsocks5 = ["config.example.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",    # 行宽由 formatter 控制
    "B008",
    "E741",    # 循环里用 host/port/l 这类短名是刻意为之
]

[tool.ruff.lint.per-file-ignores]
"torsocks5/service.py" = ["E501"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["torsocks5"]
