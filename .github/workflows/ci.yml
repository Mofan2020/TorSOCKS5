name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查 (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install --upgrade pip && pip install ruff mypy
      - name: ruff 格式与规则检查
        run: |
          ruff --version
          ruff check .
          ruff format --check . || echo "::warning::ruff format 有差异（不阻塞）"
      - name: mypy 类型检查
        run: mypy torsocks5
      - name: 确认运行期零第三方依赖
        run: |
          python - <<'PY'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = data["project"].get("dependencies", [])
          assert deps == [], f"运行期不应有依赖，当前: {deps}"
          print("OK: dependencies = []")
          PY
      - name: 文档 ↔ 代码一致性（路由/子命令/用例数/错误码/配置段/链接）
        run: |
          python scripts/check_docs.py
          python scripts/check_docs.py --selftest

  test:
    name: 测试 ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
      - name: 端到端冒烟（CLI 级：relay serve + run --route self-relay + SOCKS5 取数据）
        run: python scripts/e2e_smoke.py
      - name: 离线自检（SOCKS5 + meek 端到端）
        run: python torsocks5_cli.py selftest
      - name: 冒烟测试 --help / --version
        run: |
          python torsocks5_cli.py --version
          python torsocks5_cli.py --help
      - name: meek 传输插件握手（模拟 tor 调用）
        if: matrix.python-version == '3.12'
        run: python -m torsocks5.meek --help || true
        env:
          TOR_PT_METHODS: meek
          TOR_PT_MANAGED_TRANSPORT_VER: "1"
      - name: Windows 上验证 torrc 生成（含空格路径 shim）
        if: matrix.os == 'windows-latest'
        run: python -c "from torsocks5.tor.manager import TorProcess, ShimError; from torsocks5 import config; t=TorProcess(config.Config({}), []); print('plugin cmd:', t.plugin_command())"

  integration:
    name: 集成测试（mock meek 网桥 + 真 tor）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          tor --version
      - name: 启动 mock meek 网桥 + 本地假 ORPort
        run: |
          python - <<'PY' &
          import socket, threading, sys
          # 假 ORPort：接受连接后回显
          s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 19099)); s.listen(16)
          def handle(c):
              try:
                  while True:
                      d = c.recv(65536)
                      if not d: break
                      c.sendall(d)
              except OSError: pass
              finally: c.close()
          while True:
              c, _ = s.accept()
              threading.Thread(target=handle, args=(c,), daemon=True).start()
          PY
          sleep 1
          python -m torsocks5.meek.mock_server --port 19098 --orport 127.0.0.1:19099 -v &
          sleep 2
        env:
          PYTHONPATH: .
      - name: tor 通过 Python meek 插件启动（验证 PT 协议集成）
        run: |
          set -e
          mkdir -p /tmp/ci-tor/data
          cat > /tmp/ci-tor/torrc <<EOF
          DataDirectory /tmp/ci-tor/data
          SocksPort 19097
          Log notice stdout
          ClientOnly 1
          SafeLogging 1
          UseBridges 1
          Bridge meek 0.0.2.0:3 url=http://127.0.0.1:19098/ front=127.0.0.1
          ClientTransportPlugin meek,meek_lite exec $(which python3) $GITHUB_WORKSPACE/meek_pt.py
          EOF
          timeout 40 tor -f /tmp/ci-tor/torrc > /tmp/ci-tor/out.log 2>&1 || true
          echo "--- tor 日志 ---"
          cat /tmp/ci-tor/out.log
          echo "--- 断言 ---"
          # tor 必须能加载我们的插件并连上（1%/2% 引导阶段）
          grep -q "conn_pt" /tmp/ci-tor/out.log || { echo "::error::tor 没有进入 pluggable transport 阶段"; exit 1; }
          grep -q "conn_done_pt" /tmp/ci-tor/out.log || { echo "::error::tor 没能连上 Python 传输插件"; exit 1; }
          if grep -q "Failed to parse/validate config" /tmp/ci-tor/out.log; then
            echo "::error::torrc 语法错误"; exit 1
          fi
          echo "OK: tor 通过纯 Python meek 插件完成了 PT 握手"
      - name: 清理
        if: always()
        run: pkill -f mock_server || true; pkill -f "tor -f" || true

  relays:
    name: 中继实现（Worker / Deno）与跨语言互通
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cloudflare Worker 单元测试（node --test，不需要 workerd）
        working-directory: deploy/cloudflare
        run: node --test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Deno 中继单元测试
        working-directory: deploy/deno
        run: deno test --allow-net --allow-env --allow-read
      - name: 跨语言互通：Python 客户端 ↔ Deno 中继（真转发一次数据）
        run: |
          python scripts/interop_relay.py \
            --start "cd deploy/deno && deno run --allow-net --allow-env main.ts" \
            --port 8791 --token devtoken --timeout 90
      - name: 跨语言互通：Python 客户端 ↔ Cloudflare Worker（本地 workerd）
        # 这一步要先用 npx 下载 wrangler（约一分钟）并起 workerd，
        # 受网络影响较大，所以标记为「尽力而为」；本地已验证通过：
        #   python scripts/interop_relay.py --start "cd deploy/cloudflare && npx wrangler dev --port 8790 --var TSU_TOKEN:devtoken" --port 8790 --token devtoken
        continue-on-error: true
        run: |
          python scripts/interop_relay.py \
            --start "cd deploy/cloudflare && npx --yes wrangler@4 dev --port 8790 --var TSU_TOKEN:devtoken" \
            --port 8790 --token devtoken --timeout 240

  security:
    name: 依赖与许可检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 确认 MIT 许可证
        run: |
          head -1 LICENSE
          grep -q "MIT License" LICENSE
      - name: pip-audit（运行期无依赖应为空）
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true
      - name: 代码中不含硬编码密钥
        run: |
          ! grep -rInE '(BEGIN (RSA|OPENSSH|PRIVATE) KEY|api[_-]?key\s*=\s*["'"'"'][A-Za-z0-9]{16,})' \
            --exclude-dir=.git . || (echo "::error::发现疑似硬编码密钥" && exit 1)
          echo "OK: 未发现硬编码密钥"
